name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold
        run: |
          flutter --version
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create --org com.example --project-name offline_english_tutor --platforms=android /tmp/scaffold
          rm -rf android
          cp -r /tmp/scaffold/android android
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          sed -i 's/ package="[^"]*"//' android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import re, pathlib
          d = pathlib.Path('android/app')
          p = d / 'build.gradle.kts'
          kts = p.exists()
          if not kts:
              p = d / 'build.gradle'
          s = p.read_text()
          s = re.sub(r'minSdk(?:Version)?\s*=?\s*flutter\.minSdkVersion',
                     'minSdk = 24' if kts else 'minSdkVersion 24', s)
          dep = ('implementation("androidx.appcompat:appcompat:1.7.0")' if kts
                 else "implementation 'androidx.appcompat:appcompat:1.7.0'")
          s += '\ndependencies {\n    ' + dep + '\n}\n'
          p.write_text(s)
          print(p, 'patched')
          PY

      - run: flutter pub get

      - run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: offline-english-tutor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
