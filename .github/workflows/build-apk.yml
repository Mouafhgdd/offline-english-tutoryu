name: Build APK

on:
  workflow_dispatch:        # زر تشغيل يدوي من تبويب Actions
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # توليد ملفات الأندرويد الناقصة (gradlew, settings.gradle, MainActivity ...)
      # بدون استبدال ملفاتك الموجودة (cp -n = لا تستبدل)
      - name: Generate missing Android scaffold
        run: |
          flutter create --org com.example --project-name offline_english_tutor --platforms=android /tmp/scaffold
          mkdir -p android
          cp -rn /tmp/scaffold/android/. android/
          chmod +x android/gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-english-tutor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
